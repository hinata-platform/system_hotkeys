name: Publish

# One tag releases the set: every package whose pubspec carries the tag's
# version, in dependency order. pub.dev authenticates this run by its GitHub
# OIDC token (per package: Admin -> Automated publishing, repository
# hinata-platform/system_hotkeys, tag pattern v{{version}}). The first upload
# of each package is manual, see RELEASING.md.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  id-token: write
  contents: read

env:
  FLUTTER_VERSION: 3.47.0

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OIDC token is available
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token: pub would hang on an interactive login."
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Hand the OIDC token to pub
        run: |
          PUB_TOKEN="$(curl --retry 5 --retry-connrefused -sSLf \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://pub.dev" \
            -H "User-Agent: actions/oidc-client" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            | jq -r '.value')"
          [ -n "$PUB_TOKEN" ] && [ "$PUB_TOKEN" != "null" ] || { echo "::error::no token"; exit 1; }
          echo "::add-mask::$PUB_TOKEN"
          echo "PUB_TOKEN=$PUB_TOKEN" >> "$GITHUB_ENV"
          dart pub token add https://pub.dev --env-var PUB_TOKEN
      - run: flutter pub get
      - name: Publish what the tag names, in dependency order
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          for pkg in system_hotkeys_platform_interface system_hotkeys_macos system_hotkeys_windows system_hotkeys; do
            have="$(grep -m1 '^version:' "packages/$pkg/pubspec.yaml" | awk '{print $2}')"
            if [ "$have" = "$version" ]; then
              (cd "packages/$pkg" && flutter pub publish --force)
            else
              echo "skip $pkg ($have)"
            fi
          done
