name: system_hotkeys_linux
description: The Linux implementation of system_hotkeys, system-wide keyboard shortcuts through the GlobalShortcuts desktop portal. Pure Dart on D-Bus; no key grab, works on Wayland.
version: 0.2.1
repository: https://github.com/hinata-platform/system_hotkeys/tree/main/packages/system_hotkeys_linux
issue_tracker: https://github.com/hinata-platform/system_hotkeys/issues
topics: [hotkeys, shortcuts, linux, wayland, keyboard]

resolution: workspace

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  dbus: ^0.7.15
  flutter:
    sdk: flutter
  system_hotkeys_platform_interface: ^0.2.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: system_hotkeys
    platforms:
      linux:
        dartPluginClass: SystemHotkeysLinux
